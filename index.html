<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diletto Artesanal · Gestión interna</title>
  <meta name="description" content="Panel de gestión interna de Diletto Artesanal: abarrotes, costos de producción, ventas, historial y precios de carta.">
  <meta name="theme-color" content="#173F33">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23173F33'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-style='italic' text-anchor='middle' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E">
  <style>
/* Diletto Artesanal · panel de gestión
   Paleta: pino profundo (identidad), papel verdoso (fondo), tomate y ámbar solo para alertas. */
:root {
  --papel: #F2F5F3;
  --superficie: #FFFFFF;
  --tinta: #1C2A26;
  --tinta-2: #4A5B56;
  --tinta-3: #73847E;
  --borde: #D9E0DC;
  --borde-suave: #E8EDEA;
  --pino: #1D5B47;
  --pino-osc: #173F33;
  --pino-tinte: #E2EEE8;
  --tomate: #B0402D;
  --tomate-tinte: #F8E7E3;
  --ambar: #8F5E10;
  --ambar-tinte: #F9EFD9;
  --f-titulo: 'Newsreader', Georgia, 'Times New Roman', serif;
  --f-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r1: 6px; --r2: 10px; --r3: 14px;
  --lateral: 248px;
  --pad: 32px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--pino); outline-offset: 2px; }
.oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.salto { position: absolute; left: -999px; top: 8px; background: var(--superficie); padding: 8px 12px; border-radius: var(--r1); z-index: 100; }
.salto:focus { left: 8px; }
.tenue { color: var(--tinta-3); }
.chico { font-size: 12.5px; }
.fuerte { font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.centro { text-align: center; }
.espacio { flex: 1; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: var(--lateral) minmax(0, 1fr); min-height: 100vh; }
.lateral { background: var(--pino-osc); color: #E9F1EC; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 16px 20px; }
.marca { padding: 0 12px 28px; display: flex; flex-direction: column; line-height: 1; }
.marca-nombre { font: italic 400 34px/1 var(--f-titulo); letter-spacing: -.01em; color: #fff; }
.marca-sub { margin-top: 6px; font: 500 13px/1 var(--f-ui); letter-spacing: .12em; color: #A9C4B8; }
.menu { display: flex; flex-direction: column; gap: 4px; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--r2); padding: 11px 12px; color: #C6D9CF; transition: background .18s, color .18s; }
.menu-item:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.menu-item.activo { background: #fff; color: var(--pino-osc); font-weight: 600; }
.menu-item:focus-visible { outline-color: #fff; }
.menu-ico { display: inline-flex; flex: none; }
.lateral-pie { margin-top: auto; padding: 0 12px; font-size: 12.5px; color: #93B1A3; }
.estado.error { color: #F3B4A8; }

.principal { min-width: 0; padding: 0 var(--pad) 64px; }
.cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 32px 0 20px; }
.cabecera-titulo h1 { font: 500 34px/1.1 var(--f-titulo); letter-spacing: -.01em; }
.cabecera-titulo p { margin-top: 8px; max-width: 62ch; color: var(--tinta-2); }
.cabecera-acciones { display: flex; align-items: center; gap: 10px; flex: none; }
.acciones-vista { display: flex; gap: 10px; }
.respaldo { position: relative; }
.popover { position: absolute; right: 0; top: calc(100% + 6px); min-width: 250px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r2); padding: 6px; z-index: 30; box-shadow: 0 8px 24px rgba(23, 63, 51, .14); }
.popover button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: var(--r1); }
.popover button:hover { background: var(--papel); }
.popover .peligro { color: var(--tomate); }
.vista { outline: none; display: flex; flex-direction: column; gap: 20px; }
.vista.entra > * { animation: entra .26s var(--ease) both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 1px solid var(--borde); background: var(--superficie); border-radius: var(--r1); font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--papel); border-color: #C5CFCA; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primario { background: var(--pino); border-color: var(--pino); color: #fff; }
.btn-primario:hover { background: var(--pino-osc); border-color: var(--pino-osc); }
.btn-suave { background: transparent; border-color: transparent; color: var(--pino); padding-inline: 10px; }
.btn-suave:hover { background: var(--pino-tinte); border-color: transparent; }
.btn-peligro { background: var(--tomate); border-color: var(--tomate); color: #fff; }
.btn-peligro:hover { background: #953523; }
.btn-peligro-suave { color: var(--tomate); }
.btn-icono { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; background: transparent; border: 1px solid transparent; border-radius: var(--r1); color: var(--tinta-2); }
.btn-icono:hover { background: var(--pino-tinte); color: var(--pino); }
.btn-icono.borrar:hover { background: var(--tomate-tinte); color: var(--tomate); }
.respaldo .btn-icono { border-color: var(--borde); background: var(--superficie); }

.celda { width: 100%; min-width: 0; height: 36px; padding: 4px 8px; background: transparent; border: 1px solid transparent; border-radius: var(--r1); transition: border-color .12s, background .12s; }
.celda:hover { border-color: var(--borde); }
.celda:focus { outline: none; border-color: var(--pino); background: #fff; box-shadow: 0 0 0 3px rgba(29, 91, 71, .14); }
.celda.num { text-align: right; font-variant-numeric: tabular-nums; }
.celda::placeholder { color: #B3BFBA; }
select.celda { padding-right: 4px; cursor: pointer; }
input[type=date].celda { width: auto; border-color: var(--borde); background: #fff; }
.buscar { height: 40px; min-width: 240px; padding: 0 12px; border: 1px solid var(--borde); border-radius: var(--r1); background: #fff; }
.buscar:focus { outline: none; border-color: var(--pino); box-shadow: 0 0 0 3px rgba(29, 91, 71, .14); }
.check { display: inline-flex; align-items: center; gap: 8px; color: var(--tinta-2); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--pino); }
.rinde { display: inline-flex; align-items: center; gap: 8px; color: var(--tinta-2); }
.rinde .celda { width: 84px; border-color: var(--borde); background: #fff; }
.sufijo { color: var(--tinta-3); font-size: 12.5px; white-space: nowrap; }
.con-sufijo { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.con-sufijo .celda { width: 84px; }
.chip-toggle { min-width: 46px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--borde); background: #fff; color: var(--tinta-3); font-size: 13px; font-weight: 500; }
.chip-toggle[aria-pressed=true] { background: var(--pino-tinte); border-color: transparent; color: var(--pino); }
.chip-toggle[aria-pressed=false] { background: var(--ambar-tinte); border-color: transparent; color: var(--ambar); }

/* ---------- Pastillas, segmentos, banda ---------- */
.familias { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.fam-grupo { display: flex; flex-direction: column; gap: 6px; }
.fam-grupo-nombre { font-size: 12.5px; color: var(--tinta-3); }
.fam-lista { display: flex; flex-wrap: wrap; gap: 6px; }
.pildora { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--borde); background: var(--superficie); color: var(--tinta-2); transition: background .15s, color .15s; }
.pildora:hover { border-color: #B9C5BF; }
.pildora.activa { background: var(--pino); border-color: var(--pino); color: #fff; }
.segmentos { display: inline-flex; padding: 3px; gap: 2px; background: #E6ECE9; border-radius: var(--r1); }
.segmento { height: 34px; padding: 0 14px; border: 0; background: transparent; border-radius: 4px; color: var(--tinta-2); font-weight: 500; }
.segmento.activo { background: #fff; color: var(--pino-osc); box-shadow: 0 1px 2px rgba(23, 63, 51, .18); }
.segmentos-chico .segmento { height: 28px; padding: 0 10px; font-size: 13px; }
.banda { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r2); }
.banda-item { display: flex; flex-direction: column; gap: 4px; padding: 16px 20px; border-left: 1px solid var(--borde-suave); min-width: 0; }
.banda-item:first-child { border-left: 0; }
.banda-etiqueta { font-size: 13px; color: var(--tinta-3); }
.banda-valor { font: 500 26px/1.15 var(--f-titulo); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.banda-item.atencion .banda-valor { color: var(--ambar); }
.banda-item.destacado { background: var(--pino-tinte); }
.banda-item.destacado .banda-valor { color: var(--pino-osc); }
.banda-grande .banda-valor { font-size: 30px; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.barra-pie { padding-top: 12px; }

/* ---------- Tarjetas y tablas ---------- */
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r2); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tarjeta-cab h2 { font: 500 22px/1.2 var(--f-titulo); }
.tarjeta-cab p { margin-top: 4px; color: var(--tinta-2); font-size: 14px; max-width: 70ch; }
.subtitulo { font: 500 18px/1.2 var(--f-titulo); margin-top: 8px; }
.tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th, .tabla td { padding: 6px 10px; border-bottom: 1px solid var(--borde-suave); vertical-align: middle; text-align: left; }
.tabla th.num, .tabla td.num { text-align: right; }
.tabla thead th { font-size: 12.5px; font-weight: 500; color: var(--tinta-3); border-bottom: 1px solid var(--borde); white-space: nowrap; padding-block: 8px; }
.tabla tbody tr:hover { background: #F8FAF9; }
.tabla tfoot td { border-bottom: 0; }
.tabla-compacta th, .tabla-compacta td { padding: 4px 8px; }
.tabla .acciones { width: 44px; text-align: right; padding-inline: 2px; }
.tabla .acciones .btn-icono { width: 34px; height: 34px; opacity: .55; }
.tabla tr:hover .acciones .btn-icono, .tabla .acciones .btn-icono:focus-visible { opacity: 1; }
.tabla tr.total td { font-weight: 600; border-top: 1px solid var(--borde); background: #F8FAF9; }
.tabla tr.subtotal td { color: var(--tinta-2); font-size: 13px; background: #F8FAF9; }
.tabla tr.seccion td { font-weight: 600; color: var(--pino); background: var(--pino-tinte); padding-block: 6px; }
.col-nombre { min-width: 200px; }
.nombre-fijo { padding: 0 8px; color: var(--tinta-2); font-style: italic; }
.tabla-insumos { min-width: 980px; }
.falta { color: var(--tomate); font-weight: 500; }
td.num.falta, span.falta { background: var(--tomate-tinte); padding: 2px 8px; border-radius: 999px; font-size: 12.5px; }
.insignia { display: inline-block; min-width: 58px; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.m-ok { background: var(--pino-tinte); color: var(--pino-osc); }
.m-bajo { background: var(--ambar-tinte); color: var(--ambar); }
.m-neg { background: var(--tomate-tinte); color: var(--tomate); }
.m-nulo { background: #EEF1EF; color: var(--tinta-3); }
.nota { color: var(--tinta-3); font-size: 13px; max-width: 80ch; }
.nota-alta { color: var(--tinta-2); }
.vacio { padding: 28px 12px; text-align: center; color: var(--tinta-2); }
.vacio-titulo { font: 500 19px/1.3 var(--f-titulo); color: var(--tinta); }
.vacio-texto { margin-top: 4px; }
.etiqueta { display: inline-block; margin-top: 2px; font-size: 12.5px; color: var(--tinta-3); }
.etiqueta-semanal { color: var(--ambar); background: var(--ambar-tinte); padding: 0 8px; border-radius: 999px; margin: 0; }

/* Bloques de receta */
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 16px; align-items: start; }
.rejilla-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bloque { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r2); padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bloque-empaque { background: #FBFCFB; }
.bloque-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bloque-cab h3 { font: 500 18px/1.25 var(--f-titulo); }
.bloque-pie { padding: 4px 0 8px; }

/* Matriz de pizzas */
.matriz { border: 1px solid var(--borde-suave); border-radius: var(--r1); }
.tabla-matriz { min-width: max-content; }
.tabla-matriz th.ing { min-width: 74px; max-width: 92px; white-space: normal; line-height: 1.2; vertical-align: bottom; }
.tabla-matriz td.ing { padding: 2px 4px; }
.tabla-matriz td.ing .celda { width: 68px; padding-inline: 6px; }
.tabla-matriz th.derivada, .tabla-matriz td.derivada { white-space: nowrap; background: #F8FAF9; }
.tabla-matriz .pegado { position: sticky; left: 0; background: var(--superficie); z-index: 2; min-width: 150px; font-weight: 500; border-right: 1px solid var(--borde-suave); }
.tabla-matriz thead .pegado { background: var(--superficie); }
.tabla-precios th[scope=row] { font-weight: 500; }
.celda-precio { min-width: 130px; }
.celda-precio .celda { width: 96px; }
.celda-precio .insignia { display: block; margin: 2px 0 0 auto; width: fit-content; min-width: 0; }
.fila-sep th, .fila-sep td { border-top: 1px solid var(--borde); }

/* ---------- Ventas ---------- */
.ventas-cuerpo { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.catalogo-lista { max-height: 520px; overflow-y: auto; padding-right: 4px; }
.catalogo-fam { font: 500 17px/1.2 var(--f-titulo); margin: 14px 0 6px; }
.catalogo-fam:first-child { margin-top: 0; }
.catalogo-sec { font-size: 12.5px; font-weight: 500; color: var(--tinta-3); margin: 8px 0 6px; }
.catalogo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.producto { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-height: 64px; padding: 10px 12px; background: #fff; border: 1px solid var(--borde); border-radius: var(--r1); transition: border-color .15s, background .15s; }
.producto:hover { border-color: var(--pino); background: var(--pino-tinte); }
.producto:active { transform: scale(.985); }
.producto-nombre { font-size: 13.5px; line-height: 1.25; }
.producto-precio { font-size: 12.5px; color: var(--pino); font-weight: 600; margin-top: auto; }
.tabla-venta { min-width: 860px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper .btn-icono { width: 32px; height: 32px; border-color: var(--borde); background: #fff; }
.stepper .celda { width: 62px; text-align: center; }
.cierre { border-top: 1px solid var(--borde-suave); }
.cierre summary { display: grid; grid-template-columns: 1fr auto auto auto; gap: 20px; align-items: center; padding: 12px 4px; cursor: pointer; list-style: none; font-variant-numeric: tabular-nums; }
.cierre summary::-webkit-details-marker { display: none; }
.cierre summary:hover { background: #F8FAF9; }
.cierre-fecha { font-weight: 500; }
.cierre[open] summary { border-bottom: 1px solid var(--borde-suave); }

/* ---------- Historial ---------- */
.historial { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.meses { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r2); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.mes-cab { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px; background: transparent; border: 0; border-radius: var(--r1); text-align: left; font-weight: 500; }
.mes-cab:hover { background: var(--papel); }
.mes-cab.activo { background: var(--pino-tinte); color: var(--pino-osc); }
.chev { display: inline-flex; transition: transform .18s var(--ease); color: var(--tinta-3); }
.mes-cab[aria-expanded=true] .chev { transform: rotate(90deg); }
.mes-nombre { flex: 1; }
.contador { min-width: 24px; padding: 0 8px; border-radius: 999px; background: #EAEFEC; color: var(--tinta-2); font-size: 12.5px; text-align: center; font-variant-numeric: tabular-nums; }
.mes-dias { list-style: none; margin: 2px 0 6px 22px; padding: 0 0 0 10px; border-left: 1px solid var(--borde); }
.dia { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px; background: transparent; border: 0; border-radius: var(--r1); color: var(--tinta-2); }
.dia:hover { background: var(--papel); }
.dia.activo { background: var(--pino); color: #fff; }
.dia.activo .contador { background: rgba(255, 255, 255, .22); color: #fff; }
.dia.vacio-dia { color: var(--tinta-3); }
.archivos { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r2); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.archivos-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.archivos-cab h2 { font: 500 24px/1.2 var(--f-titulo); }
.dia-titulo { display: flex; align-items: center; gap: 10px; font: 500 18px/1.2 var(--f-titulo); margin-top: 6px; }
.archivos-lista { display: flex; flex-direction: column; }
.archivo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--borde-suave); }
.archivo:first-child { border-top: 0; }
.archivo-ico { display: inline-flex; width: 42px; height: 42px; align-items: center; justify-content: center; border-radius: var(--r1); background: var(--tomate-tinte); color: var(--tomate); }
.archivo-nombre { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.archivo-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.archivo-acc { display: flex; align-items: center; gap: 2px; }

.zona { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px; border: 1.5px dashed #B9C8C1; border-radius: var(--r2); color: var(--tinta-2); background: #FAFCFB; text-align: center; }
.zona p { margin: 0; }
.zona-grande { padding: 64px 24px; background: var(--superficie); }
.zona svg { color: var(--pino); }

/* ---------- Diálogos ---------- */
.dialogo { border: 0; border-radius: var(--r3); padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); color: var(--tinta); box-shadow: 0 24px 60px rgba(23, 63, 51, .3); }
.dialogo::backdrop { background: rgba(23, 63, 51, .4); }
.dialogo[open] { display: flex; flex-direction: column; animation: entra .2s var(--ease); }
.dialogo-chico { width: min(420px, calc(100vw - 32px)); padding: 24px; gap: 8px; }
.dialogo-chico h2 { font: 500 22px/1.2 var(--f-titulo); }
.dialogo-chico p { color: var(--tinta-2); }
.dialogo-ancho { width: min(760px, calc(100vw - 32px)); }
.dialogo-visor { width: min(1000px, calc(100vw - 32px)); height: calc(100vh - 48px); }
.dialogo-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--borde-suave); }
.dialogo-cab h2 { font: 500 22px/1.2 var(--f-titulo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cab-acciones { display: flex; align-items: center; gap: 8px; flex: none; }
.dialogo-cuerpo { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.dialogo-pie { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--borde-suave); }
.dialogo-chico .dialogo-pie { padding: 12px 0 0; border: 0; }
.visor { flex: 1; width: 100%; border: 0; background: #EEF1EF; }
.pend-lista { display: flex; flex-direction: column; gap: 14px; }
.pend { border: 1px solid var(--borde); border-radius: var(--r2); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.pend header { display: flex; align-items: center; gap: 12px; }
.pend-ico { display: inline-flex; color: var(--tomate); }
.pend-nombre { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pend-nombre strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.clasif { display: flex; flex-direction: column; gap: 14px; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo-fila { flex-direction: row; gap: 14px; }
.campo-fila > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.campo-etq { font-size: 13px; font-weight: 500; color: var(--tinta-2); }
.campo-ayuda { font-size: 12.5px; color: var(--tinta-3); }
.campo .celda { border-color: var(--borde); background: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--borde); background: #fff; color: var(--tinta-2); font-weight: 500; }
.chip.activo { background: var(--pino); border-color: var(--pino); color: #fff; }

/* ---------- Avisos ---------- */
.avisos { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 200; pointer-events: none; width: min(92vw, 520px); }
.aviso { background: var(--pino-osc); color: #fff; padding: 11px 18px; border-radius: var(--r1); font-size: 14px; box-shadow: 0 8px 24px rgba(23, 63, 51, .25); animation: entra .2s var(--ease); }
.aviso.error { background: var(--tomate); }
.aviso.sale { opacity: 0; transition: opacity .35s; }

/* ---------- Adaptación a tablet y móvil ---------- */
@media (max-width: 1099px) {
  :root { --lateral: 92px; --pad: 24px; }
  .lateral { padding: 20px 8px 16px; align-items: stretch; }
  .marca { padding: 0 0 20px; align-items: center; }
  .marca-nombre { font-size: 26px; }
  .marca-sub { font-size: 10px; letter-spacing: .08em; }
  .menu-item { flex-direction: column; gap: 4px; padding: 10px 4px; text-align: center; font-size: 11.5px; line-height: 1.2; }
  .lateral-pie { display: none; }
  .ventas-cuerpo, .historial { grid-template-columns: 1fr; }
  .catalogo-lista { max-height: 340px; }
  .rejilla-2 { grid-template-columns: 1fr; }
  .banda { grid-auto-flow: row; grid-template-columns: repeat(2, 1fr); }
  .banda-item { border-left: 0; border-top: 1px solid var(--borde-suave); }
  .banda-item:nth-child(-n+2) { border-top: 0; }
  .banda-item:nth-child(even) { border-left: 1px solid var(--borde-suave); }
  .meses { flex-direction: row; flex-wrap: wrap; }
  .mes { flex: 1 1 260px; }
}
@media (max-width: 719px) {
  :root { --pad: 14px; }
  .app { grid-template-columns: 1fr; padding-bottom: 68px; }
  .lateral { position: fixed; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); z-index: 40; }
  .marca { display: none; }
  .menu { flex-direction: row; width: 100%; gap: 2px; }
  .menu-item { flex: 1; min-width: 0; font-size: 10.5px; padding: 8px 2px; }
  .cabecera { flex-direction: column; padding-top: 20px; }
  .cabecera-titulo h1 { font-size: 28px; }
  .cabecera-acciones { width: 100%; justify-content: space-between; }
  .archivo { grid-template-columns: auto minmax(0, 1fr); }
  .archivo-acc { grid-column: 1 / -1; justify-content: flex-end; }
  .campo-fila { flex-direction: column; }
  .buscar { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Impresión (reporte de ventas del día) ---------- */
@media print {
  body { background: #fff; font-size: 12px; }
  .lateral, .respaldo, .acciones-vista, .no-imprimir, .familias, .avisos, .salto, .cierre { display: none !important; }
  .app { display: block; padding: 0; }
  .principal { padding: 0; }
  .cabecera { padding: 0 0 12px; }
  .tarjeta, .banda { border-color: #999; break-inside: avoid; }
  .ventas-cuerpo { display: block; }
  .tabla-scroll { overflow: visible; }
  .tabla-venta { min-width: 0; }
  .vista.entra > * { animation: none; }
}

/* Motor de cálculo de Diletto Artesanal.

(function (root) {

/* Estado de la aplicación, persistencia (localStorage + IndexedDB para PDFs) y respaldos. */
(function () {

  const DL = window.DL;
  const E = window.DLEngine;
  const D = window.DILETTO_DATA;
  const KEY = 'diletto.estado.v1';

  const Store = (DL.Store = { state: null, persistOK: true, _t: null });

  function catalogState() {
    return {
      insumos: clone(D.insumos),
      bloques: clone(D.bloques),
      pizzas: { tamanos: clone(D.pizzas.tamanos), masaG: clone(D.pizzas.masaG), matrices: clone(D.pizzas.matrices), tajada: clone(D.pizzas.tajada) },
      pasteles: Object.fromEntries(Object.keys(D.pasteles).map((k) => [k, { tajadas: D.pasteles[k].tajadas }])),
      precios: {},
    };
  }
  Store.defaultState = () => Object.assign({
    v: 1,
    config: { margenObjetivo: 0.5 },
    venta: { fecha: DL.isoToday(), lineas: [] },
    cierres: [],
    historial: [],
    ui: {},
  }, catalogState());

  function merge(saved) {
    const base = Store.defaultState();
    if (!saved || typeof saved !== 'object') return base;
    const s = Object.assign(base, saved);
    // Garantiza estructuras mínimas si el guardado es antiguo o está incompleto
    ['insumos', 'bloques', 'pizzas', 'pasteles', 'precios'].forEach((k) => { if (!saved[k]) s[k] = catalogState()[k]; });
    s.config = Object.assign({ margenObjetivo: 0.5 }, saved.config || {});

    if (!Array.isArray(s.venta.lineas)) s.venta.lineas = [];
    if (!Array.isArray(s.cierres)) s.cierres = [];
    if (!Array.isArray(s.historial)) s.historial = [];
    if (!s.ui) s.ui = {};
    return s;
  }

  Store.load = () => {
    let saved = null;
    try { const raw = localStorage.getItem(KEY); if (raw) saved = JSON.parse(raw); } catch (e) { Store.persistOK = false; }

    E.init(D, Store.state);

  };

  Store.save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(Store.state)); Store.persistOK = true; DL.setSaved && DL.setSaved(true); }
    catch (e) { Store.persistOK = false; DL.setSaved && DL.setSaved(false); }
  };
  // Llamar después de cualquier modificación del estado.
  Store.changed = () => {
    E.touch();

    (Store.state.bloques[fam] || []).forEach((b) => b.lineas.forEach((l) => { if (l.i && E.norm(l.i) === k) n++; }));
    if (fam === 'pizzas') {
      const P = Store.state.pizzas;
      Object.values(P.matrices).forEach((m) => { const j = m.cols.findIndex((c) => E.norm(c) === k); if (j >= 0) m.filas.forEach((f) => { if (E.num(f.g[j])) n++; }); });
      const j = P.tajada.cols.findIndex((c) => E.norm(c) === k); if (j >= 0) P.tajada.filas.forEach((f) => { if (E.num(f.g[j])) n++; });
    }

    const k = E.norm(oldName);

  pdf.get = (id) => pdf.db().then((db) => new Promise((res) => {
    if (!db) return res(mem.get(id) || null);
    const r = db.transaction('pdfs', 'readonly').objectStore('pdfs').get(id);
    r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);

(function () {

          DL.segmented({ label: 'Tipo de reporte', value: rec.tipo, options: [{ v: 'Diario', t: 'Diario' }, { v: 'Semanal', t: 'Semanal' }], onPick: (v) => { rec.tipo = v; if (v === 'Diario' && rec.dias.length > 1) rec.dias = rec.dias.slice(0, 1); build(); } })),

              else DL.toast(nombre + ' no es día de atención. Elige el día manualmente.', 'error');

(function () {
  'use strict';
  const DL = window.DL, h = DL.h;
  const NAV = [
    { id: 'abarrotes', label: 'Abarrotes y materiales', icon: 'abarrotes' },
    { id: 'produccion', label: 'Costo de producción', icon: 'produccion' },
    { id: 'ventas', label: 'Ventas', icon: 'ventas' },
    { id: 'historial', label: 'Historial de ventas', icon: 'historial' },
    { id: 'carta', label: 'Precios de carta', icon: 'carta' },

  let current = null;

  function renderMenu() {
    const menu = document.getElementById('menu'); DL.clear(menu);
    NAV.forEach((n) => menu.append(h('button', { type: 'button', class: 'menu-item' + (n.id === current ? ' activo' : ''), 'aria-current': n.id === current ? 'page' : null, onclick: () => DL.go(n.id) },
      h('span', { class: 'menu-ico', html: DL.icons[n.icon] }), h('span', { class: 'menu-txt' }, n.label))));
  }

  function draw(keepScroll) {
    const view = DL.views[current];
    const host = document.getElementById('vista');
    const y = window.scrollY;
    if (keepScroll) host.classList.remove('entra');
    DL.resetBinds(); DL.clear(host);
    document.getElementById('tituloVista').textContent = view.titulo;
    document.getElementById('subVista').textContent = view.sub;
    const acc = DL.clear(document.getElementById('accionesVista'));
    if (view.acciones) view.acciones(acc);
    try { view.render(host); } catch (e) { console.error(e); host.append(DL.empty('No se pudo mostrar esta sección', 'Recarga la página. Si el problema continúa, exporta un respaldo y restablece los datos.')); }
    DL.refresh();
    if (keepScroll) window.scrollTo(0, y);
  }

  // Cambia de sección con una transición suave
  DL.go = (id) => {
    if (!DL.views[id]) id = 'ventas';
    const host = document.getElementById('vista');
    const cambio = id !== current;
    current = id; DL.Store.state.ui.view = id;
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ }
    renderMenu();
    if (!cambio) return draw(true);
    host.classList.remove('entra'); void host.offsetWidth;
    draw(false); window.scrollTo(0, 0);
    host.classList.add('entra'); host.focus({ preventScroll: true });
    DL.Store.save();
  };
  DL.rerender = (after) => { draw(true); if (after) after(); };

  DL.setSaved = (ok) => {
    const el = document.getElementById('estadoGuardado'); if (!el) return;
    if (ok === null) { el.textContent = 'Guardando…'; el.className = 'estado'; return; }
    el.textContent = ok ? 'Guardado en este navegador' : 'No se pudo guardar. Exporta un respaldo.';
    el.className = 'estado' + (ok ? '' : ' error');
  };

  /* Menú de respaldo */
  function setupBackup() {
    const btn = document.getElementById('btnRespaldo'), menu = document.getElementById('menuRespaldo');
    const file = document.getElementById('archivoRespaldo');
    const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; btn.setAttribute('aria-expanded', String(!menu.hidden)); });
    document.addEventListener('click', (e) => { if (!menu.contains(e.target)) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    menu.querySelector('[data-a="exportar"]').addEventListener('click', async () => {
      close();
      try {
        const data = await DL.Store.exportBackup();
        const hoy = DL.isoToday();
        DL.Store.download('diletto-respaldo-' + hoy + '.json', new Blob([JSON.stringify(data)], { type: 'application/json' }));
        DL.toast('Respaldo exportado.');
      } catch (e) { console.error(e); DL.toast('No se pudo exportar el respaldo.', 'error'); }
    });
    menu.querySelector('[data-a="importar"]').addEventListener('click', () => { close(); file.click(); });
    file.addEventListener('change', async () => {
      const f = file.files[0]; file.value = ''; if (!f) return;
      if (!(await DL.confirm({ titulo: 'Importar respaldo', mensaje: 'Reemplaza todos los datos actuales por los del archivo, incluidos los PDF.', ok: 'Importar', peligro: true }))) return;
      try { await DL.Store.importBackup(JSON.parse(await f.text())); DL.go(DL.Store.state.ui.view || 'ventas'); DL.toast('Respaldo importado.'); }
      catch (e) { console.error(e); DL.toast(e.message || 'El archivo no es válido.', 'error'); }
    });
    menu.querySelector('[data-a="restablecer"]').addEventListener('click', async () => {
      close();
      if (!(await DL.confirm({ titulo: 'Restablecer datos del Excel', mensaje: 'Vuelven los insumos, recetas y precios originales. Se conservan tus ventas, cierres y PDF.', ok: 'Restablecer', peligro: true }))) return;
      DL.Store.resetCatalog(); DL.rerender(); DL.toast('Datos restablecidos.');
    });
  }

  function start() {
    DL.Store.load();
    const hash = (location.hash || '').replace('#', '');
    current = DL.views[hash] ? hash : (DL.views[DL.Store.state.ui.view] ? DL.Store.state.ui.view : 'ventas');
    renderMenu(); setupBackup(); draw(false);
    document.getElementById('vista').classList.add('entra');
    window.addEventListener('hashchange', () => { const id = location.hash.replace('#', ''); if (DL.views[id] && id !== current) DL.go(id); });
    if (!DL.Store.persistOK) DL.toast('Tu navegador bloquea el almacenamiento: los cambios no se guardarán.', 'error');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
  <script>document.getElementById('btnRespaldo').innerHTML = window.DL.icons.mas_opciones;</script>
</body>
