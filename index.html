<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diletto Artesanal – Gestión interna</title>
  <meta name="theme-color" content="#15222A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315222A'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='600'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">D</span>
        <div>
          <div class="brand-name">Diletto Artesanal</div>
          <div class="brand-sub">Gestión interna</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Secciones">
        <button type="button" class="nav-btn" data-view="abarrotes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          <span>ABARROTES Y MATERIALES</span>
        </button>
        <button type="button" class="nav-btn" data-view="costos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
          <span>COSTO DE PRODUCCIÓN</span>
        </button>
        <button type="button" class="nav-btn" data-view="ventas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
          <span>VENTAS</span>
        </button>
        <button type="button" class="nav-btn" data-view="historial">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
          <span>HISTORIAL DE VENTAS</span>
        </button>
        <button type="button" class="nav-btn" data-view="precios">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1"/></svg>
          <span>PRECIOS DE CARTA</span>
        </button>
      </nav>

      <div class="side-foot">
        <p>Los datos se guardan en este navegador.</p>
        <div class="foot-links">
          <button type="button" class="link-btn" data-act="backup-export">Exportar respaldo</button>
          <button type="button" class="link-btn" data-act="backup-import">Importar respaldo</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="container">
        <div id="banner"></div>
        <section id="view" class="view"></section>
      </div>
    </main>
  </div>

  <input type="file" id="backup-input" accept="application/json,.json" hidden>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" id="modal-card" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js" defer></script>
</body>
</html>
